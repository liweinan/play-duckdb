name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests package

      - name: Install Nomad
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nomad.zip \
            https://releases.hashicorp.com/nomad/1.9.7/nomad_1.9.7_linux_amd64.zip
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin
          nomad version

      - name: Compose seed → query → layers → report
        run: |
          set -o pipefail
          ./run.sh all | tee /tmp/play-duckdb-run.log

      - name: Verify reports
        run: |
          set -euo pipefail
          ls -la reports/
          grep -q '\[nomad\] spark-worker running=2' /tmp/play-duckdb-run.log
          inv=$(ls -1t reports/report_inventory_by_asset_*.csv | head -1)
          loans=$(ls -1t reports/report_open_loans_*.csv | head -1)
          layered=$(ls -1t reports/report_layered_open_loans_*.csv | head -1)
          test "$(wc -l < "$inv")" -eq 5
          test "$(wc -l < "$loans")" -eq 3
          test "$(wc -l < "$layered")" -eq 4
          grep -q '2026-08-02,BOND,1,1230000.0,CNY' "$inv"
          grep -q '2026-08-01,2,150.0,27.5' "$loans"
          grep -q 'L-1,ACC-A,ACC-B,EQ-HK-88,100.0,35.0,OPEN,480.0,400000.0' "$layered"
          echo "reports ok: $inv $loans $layered"
