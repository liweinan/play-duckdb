# Spark writes Iceberg (JdbcCatalog in Postgres, files in MinIO).
# Nomad schedules Spark Standalone (master + workers) and the ETL batch.
# DuckDB reads the catalog pointer from Postgres, then iceberg_scan on MinIO.
#
# Proxy tip (macOS Docker Desktop → host Clash/V2Ray on 7890):
#   Host pull uses 127.0.0.1; image build/run uses host.docker.internal.
#   ./run.sh all

name: play-duckdb

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 3s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set minio http://minio:9000 admin password; do
          echo '...waiting for minio...'
          sleep 1
        done
        mc mb -p minio/warehouse
        mc anonymous set public minio/warehouse || mc policy set public minio/warehouse
        echo 'warehouse bucket ready'

  nomad:
    image: hashicorp/nomad:1.9.7
    user: root
    privileged: true
    cgroup: host
    command: ["agent", "-dev", "-bind=0.0.0.0", "-data-dir=/nomad/data"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NOMAD_SKIP_DOCKER_IMAGE_WARN: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/play-duckdb-nomad:/nomad/data
      - ./nomad/jobs:/opt/nomad/jobs:ro
    ports:
      - "4646:4646"
    healthcheck:
      test: ["CMD", "nomad", "node", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY-http://host.docker.internal:7890}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY-http://host.docker.internal:7890}
        NO_PROXY: ${NO_PROXY-localhost,127.0.0.1,host.docker.internal}
    image: play-duckdb-spark:local
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER: local[2]
      OBSERVE: ${OBSERVE:-}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_S3_ENDPOINT: http://minio:9000
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "minio,postgres,localhost,127.0.0.1"
      no_proxy: "minio,postgres,localhost,127.0.0.1"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  play-duckdb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY-http://host.docker.internal:7890}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY-http://host.docker.internal:7890}
        NO_PROXY: ${NO_PROXY-localhost,127.0.0.1,host.docker.internal}
    image: play-duckdb:local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./sql:/app/sql:ro
    environment:
      OBSERVE: ${OBSERVE:-}
      REPORT_DIR: /app/reports
      SQL_DIR: /app/sql
      PG_JDBC_URL: jdbc:postgresql://postgres:5432/iceberg
      PG_USER: iceberg
      PG_PASSWORD: iceberg
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password
      S3_REGION: us-east-1
      HTTP_PROXY: ${BUILD_HTTP_PROXY-http://host.docker.internal:7890}
      HTTPS_PROXY: ${BUILD_HTTPS_PROXY-http://host.docker.internal:7890}
      http_proxy: ${BUILD_HTTP_PROXY-http://host.docker.internal:7890}
      https_proxy: ${BUILD_HTTPS_PROXY-http://host.docker.internal:7890}
      NO_PROXY: minio,postgres,spark,localhost,127.0.0.1
      no_proxy: minio,postgres,spark,localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: play-duckdb_default
